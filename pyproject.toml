[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resbench"
version = "1.0.0"
description = "A benchmark for generative AI models of 3D reservoir geology, measured against the ResMill process simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

[project.scripts]
resbench = "resbench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["resbench*"]
